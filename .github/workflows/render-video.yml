name: Render Anime Video

on:
  workflow_dispatch:
    inputs:
      fps:
        description: 'Frames per second'
        required: false
        default: '12'
      seconds_per_image:
        description: 'Seconds each image stays on screen'
        required: false
        default: '2'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render image sequence
        shell: bash
        run: |
          set -e
          mkdir -p clips output

          mapfile -t IMAGES < <(find images -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | sort)

          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo 'No images found in images/. Add PNG/JPG source images and run the workflow again.'
            exit 1
          fi

          mkdir -p .render/input
          i=1
          for image in "${IMAGES[@]}"; do
            ext="${image##*.}"
            printf -v n '%04d' "$i"
            cp "$image" ".render/input/frame_${n}.${ext}"
            i=$((i+1))
          done

          # Build a temporary concat file so mixed PNG/JPG inputs are supported.
          : > .render/concat.txt
          for image in .render/input/*; do
            echo "file '$PWD/$image'" >> .render/concat.txt
            echo "duration ${{ github.event.inputs.seconds_per_image || '2' }}" >> .render/concat.txt
          done
          last=$(ls .render/input/* | tail -n 1)
          echo "file '$PWD/$last'" >> .render/concat.txt

          ffmpeg -y -f concat -safe 0 -i .render/concat.txt \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2,format=yuv420p" \
            -r "${{ github.event.inputs.fps || '12' }}" \
            -c:v libx264 -preset medium -crf 20 \
            output/anime-video.mp4

      - name: Add optional audio
        shell: bash
        run: |
          set -e
          if [ -f audio/narration.mp3 ]; then
            ffmpeg -y -i output/anime-video.mp4 -i audio/narration.mp3 \
              -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -shortest \
              output/anime-video-with-audio.mp4
          else
            echo 'No audio/narration.mp3 found; keeping video without audio.'
          fi

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: anime-video
          path: output/*.mp4
          if-no-files-found: error
